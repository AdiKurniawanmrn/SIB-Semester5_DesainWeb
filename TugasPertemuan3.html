<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Manajemen Produk Toko</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #fafafa;
    }

    h2, h3 {
      text-align: center;
    }

    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;   /* tabel ke tengah */
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    table, th, td {
      border: 1px solid #333;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }

    button {
      margin: 5px 0;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .add-btn { background-color: #238c27; color: white; }
    .delete-btn { background-color: #b63027; color: white; }

    /* Form container di tengah */
    .form-container {
      text-align: center;
      margin-top: 20px;
    }

    .form-container input {
      margin: 5px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h2>Daftar Produk Toko</h2>
  <div id="produkContainer"></div>

  <h3>Tambah Produk Baru</h3>
  <div class="form-container">
    <input type="text" id="nama" placeholder="Nama Produk">
    <input type="number" id="harga" placeholder="Harga">
    <input type="number" id="stok" placeholder="Stok">
    <button class="add-btn" onclick="tambahProdukBaru()">Tambah Produk</button>
  </div>

  <script>
    let produkToko = [
      { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
      { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
      { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
    ];

    // fungsi menampilkan produk
    function tampilkanProduk() {
      let container = document.getElementById("produkContainer");
      let html = "<table><tr><th>ID</th><th>Nama</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr>";

      produkToko.forEach(produk => {
        html += `<tr>
                  <td>${produk.id}</td>
                  <td>${produk.nama}</td>
                  <td>Rp${produk.harga.toLocaleString()}</td>
                  <td>${produk.stok}</td>
                  <td><button class="delete-btn" onclick="hapusProduk(${produk.id})">Hapus</button></td>
                </tr>`;
      });

      html += "</table>";
      container.innerHTML = html;
    }

    // fungsi menambah produk
    function tambahProduk(nama, harga, stok) {
      let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
      let produkBaru = { id: idBaru, nama: nama, harga: harga, stok: stok };
      produkToko.push(produkBaru);
      tampilkanProduk();
    }

    function tambahProdukBaru() {
      let nama = document.getElementById("nama").value;
      let harga = parseInt(document.getElementById("harga").value);
      let stok = parseInt(document.getElementById("stok").value);

      if (nama && harga > 0 && stok > 0) {
        tambahProduk(nama, harga, stok);
        document.getElementById("nama").value = "";
        document.getElementById("harga").value = "";
        document.getElementById("stok").value = "";
      } else {
        alert("Isi semua field dengan benar!");
      }
    }

    // fungsi menghapus produk
    function hapusProduk(id) {
      let index = produkToko.findIndex(produk => produk.id === id);
      if (index !== -1) {
        produkToko.splice(index, 1);
        tampilkanProduk();
      } else {
        alert(`Produk dengan ID ${id} tidak ditemukan.`);
      }
    }

    // tampilkan produk pertama kali
    tampilkanProduk();
  </script>
</body>
</html>
